/* Contractor site-ledger · visual system: navy shell, gold accents, grouped lists instead of stacked white sheets */
:root{

}

  --navy2:#3A5590; --goldink:#E2C35A; --goldbg:#332B16; --ok:#5CC27A; --okbg:#173525; --bad:#F08A7E; --badbg:#3A1C1C; --warn:#F0A65A; --warnbg:#3A2A16; --info:#9DB8F0; --infobg:#1E2B4A;
  --t-op:#1E2B4A; --t-op-i:#9DB8F0; --t-cash:#173525; --t-cash-i:#7FD39B; --t-oth:#2A2142; --t-oth-i:#C4A8F0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#151F33; --field:#1A263D; --sunk:#1C2944; --ink:#E7EBF3; --muted:#9AA5BA; --line:#26324D; --line2:#212C45;
  --navy2:#3A5590; --goldink:#E2C35A; --goldbg:#332B16; --ok:#5CC27A; --okbg:#173525; --bad:#F08A7E; --badbg:#3A1C1C; --warn:#F0A65A; --warnbg:#3A2A16; --info:#9DB8F0; --infobg:#1E2B4A;
  --t-op:#1E2B4A; --t-op-i:#9DB8F0; --t-cash:#173525; --t-cash-i:#7FD39B; --t-oth:#2A2142; --t-oth-i:#C4A8F0; color-scheme:dark }
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;direction:rtl;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* app bar */
.ab{position:sticky;top:0;z-index:40;height:calc(var(--abh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:inset 0 -3px 0 var(--gold)}

.who .me i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:12px}
.who .me small{color:#AAB4CC}
.who .ib{width:32px;height:32px;border-radius:10px;border:0;background:rgba(255,255,255,.08);color:#DCE2EF;display:grid;place-items:center;cursor:pointer}
.who .ib:hover{background:rgba(255,255,255,.16)}
@media(max-width:420px){.who .me b{max-width:84px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}.ab .tt small{display:none}}
/* navigation: bottom bar on phones, sidebar on desktop */
.bar{position:fixed;z-index:45;background:var(--surface)}
.tabs{display:flex}
.tabs button{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;display:flex;align-items:center;position:relative}
.tabs button .ll{display:none}

  .tabs{height:var(--bnh)}.tabs button{flex:1;flex-direction:column;justify-content:center;gap:3px;font-size:11px;padding:0 2px}
  .tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

}

  .tabs{flex-direction:column;gap:4px}.tabs button{gap:11px;padding:10px 14px;border-radius:11px;color:#C6CDE0;font-size:14.5px;text-align:right}

  .tabs button:hover{background:rgba(255,255,255,.06);color:#fff}

}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);transition:transform .08s,background .15s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:#C8CEDA}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}

.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:var(--infobg);color:var(--info)}
.pill.dotp::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.f input,.f select,.f textarea,input.in,select.in{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:15px;color:var(--ink);min-height:42px;width:100%;transition:border-color .15s,background .15s}

.g{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpis>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--sh)}

:root[data-theme="dark"] .kpis strong{color:var(--ink)}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr);gap:8px}.kpis strong{font-size:17px}}
/* section heading */
.gh{display:flex;align-items:baseline;justify-content:space-between;margin:18px 4px 8px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.2px}
.gh a,.gh button{font-size:12.5px}
/* grouped day sections */
.grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
details.sec{border:0;margin:0;background:none}
details.sec+details.sec{border-top:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:11px 13px;position:relative;user-select:none}

.sic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.sic.op{background:var(--t-op);color:var(--t-op-i)}.sic.cs{background:var(--t-cash);color:var(--t-cash-i)}.sic.ot{background:var(--t-oth);color:var(--t-oth-i)}
.sec .stx{flex:1;min-width:0}
.sec h3{margin:0;font-size:15px;line-height:1.3}
details.sec>summary>h3{flex:1}details.sec>summary>.chev:first-child{transform:rotate(-135deg)}details.sec[open]>summary>.chev:first-child{transform:rotate(-45deg)}
.sec .ssub{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec .tot{font-weight:700;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}

.sdot{width:8px;height:8px;border-radius:50%;background:#CFD4DE;flex:none}

.chev{width:8px;height:8px;border-inline-start:2px solid #A3A9B7;border-bottom:2px solid #A3A9B7;transform:rotate(-135deg);flex:none;transition:transform .18s;margin-inline-start:2px}

:root[data-theme="dark"] .net{color:var(--ink)}

@media(min-width:1000px){.eq{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);column-gap:18px;align-items:start}.eq .eh{grid-row:1/span 6;flex-direction:column;align-items:stretch}.eq .eact{justify-content:flex-start;margin:4px 0 0}.eq .hrow{grid-column:2;margin-top:0}.eq .hrow+.hrow{margin-top:8px}
  .sb>.tsup~.tk{display:inline-grid;width:calc(50% - 6px);vertical-align:top;margin-inline-end:8px}}
.eq.off .eh .nm b{color:var(--muted)}

.hrow .net b{color:var(--navy);background:var(--sunk);border-radius:8px;padding:3px 10px;font-size:14px}

.evl{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:9px;flex-basis:100%}

.seg.rt button.ex[aria-pressed="true"]{background:var(--ok);color:#fff}.seg.rt button.gd[aria-pressed="true"]{background:var(--info);color:#fff}.seg.rt button.pr[aria-pressed="true"]{background:var(--bad);color:#fff}

  if(!window.jspdf||!window.jspdf.jsPDF)return toast("مكتبة PDF لم تُحمّل – أعد فتح الصفحة");

  try{await document.fonts.load('600 20px "IBM Plex Sans Arabic"');await document.fonts.load('400 20px "IBM Plex Sans Arabic"')}catch(e){}
  const W=1240,H=1754,MX=70,F='"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif';const pages=[];let cv,ctx,y;
  const font=(w,s)=>ctx.font=`${w} ${s}px ${F}`;

  function newPage(){cv=document.createElement("canvas");cv.width=W;cv.height=H;cv.setAttribute("dir","rtl");ctx=cv.getContext("2d");pages.push(cv);
    ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.fillStyle="#1B2A4A";ctx.fillRect(0,0,W,8);ctx.fillStyle="#C9A227";ctx.fillRect(0,8,W,20);
    const lx=W-MX-84,ly=52;ctx.fillStyle="#C9A227";roundRect(lx,ly,84,84,14);ctx.fillStyle="#1B2A4A";roundRect(lx,ly,84,76,14);ctx.fillRect(lx,ly+50,84,26);

    ctx.direction="ltr";font(600,15);ctx.fillStyle="#8C6D1F";ctx.textAlign="right";ctx.fillText("C O N T R A C T O R   ·   G E N E R A L   C O N T R A C T I N G",lx-22,ly+72);

    ctx.fillStyle="#1B2A4A";ctx.fillRect(0,158,W,4);
    font(400,15);txt(`صفحة ${pages.length}  ·  طُبع ${new Date().toLocaleString("ar-EG")}`,MX,H-30,"left","#8892A3");ctx.fillStyle="#E4E7EE";ctx.fillRect(MX,H-58,W-2*MX,1);
    font(600,15);txt("كونتراكتر للمقاولات العامة",W-MX,H-30,"right","#1B2A4A");
    y=196;if(pages.length===1&&title){font(700,34);txt(title,W/2,y+14,"center","#1B2A4A");font(500,21);txt(subtitle,W/2,y+50,"center","#8C6D1F");y+=84}}
  function roundRect(x,yy,w,h,r){ctx.beginPath();ctx.moveTo(x+r,yy);ctx.arcTo(x+w,yy,x+w,yy+h,r);ctx.arcTo(x+w,yy+h,x,yy+h,r);ctx.arcTo(x,yy+h,x,yy,r);ctx.arcTo(x,yy,x+w,yy,r);ctx.closePath();ctx.fill()}
  const need=h=>{if(y+h>H-76)newPage()};
  const rr=(x,yy,w,h,r,fill,stroke)=>{if(fill){ctx.fillStyle=fill;roundRect(x,yy,w,h,r)}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+r,yy);ctx.arcTo(x+w,yy,x+w,yy+h,r);ctx.arcTo(x+w,yy+h,x,yy+h,r);ctx.arcTo(x,yy+h,x,yy,r);ctx.arcTo(x,yy,x+w,yy,r);ctx.closePath();ctx.stroke()}};
  const secTitle=t=>{font(700,22);ctx.fillStyle="#C9A227";ctx.fillRect(W-MX-6,y+4,6,24);txt(t,W-MX-16,y+24,"right","#1B2A4A");y+=42};
  newPage();
  for(const b of blocks){
    if(b.type==="head"){const h=b.info;const bw=300;
      font(700,16);txt(h.label,W-MX,y+18,"right","#9A7A1C");font(700,38);txt(fit(h.name,W-2*MX-bw-30),W-MX,y+66,"right","#1B2A4A");font(400,17);txt(fit(h.project,W-2*MX-bw-30),W-MX,y+98,"right","#5B6475");
      rr(MX,y,bw,84,14,"#1B2A4A");ctx.fillStyle="#C9A227";ctx.fillRect(MX+14,y+80,bw-28,4);font(500,15);txt("الفترة المحاسبية",MX+bw/2,y+28,"center","#E7CF7A");font(700,30);txt(h.period,MX+bw/2,y+66,"center","#fff");
      font(400,15);txt("رقم الكشف",MX+bw,y+112,"right","#5B6475");ctx.direction="ltr";font(700,15);ctx.fillStyle="#1B2A4A";ctx.textAlign="left";ctx.fillText(h.no,MX+bw/2-6,y+112);ctx.fillText(h.issued,MX,y+136);ctx.direction="rtl";font(400,15);txt("تاريخ الإصدار",MX+bw,y+136,"right","#5B6475");y+=156}
    else if(b.type==="cards"){need(130);const n=b.items.length,gap=14,tw=W-2*MX;const ws=b.items.map(it=>it[3]?1.3:1);const tot=ws.reduce((a,c)=>a+c,0);let x=W-MX;
      b.items.forEach(([l,v,u,hi],i)=>{const cw=(tw-gap*(n-1))*ws[i]/tot;x-=cw;rr(x,y,cw,110,14,hi?"#1B2A4A":"#F7F8FB",hi?null:"#E1E5EC");if(hi){ctx.fillStyle="#C9A227";ctx.fillRect(x+14,y+106,cw-28,4)}
        font(500,15);txt(fit(l,cw-30),x+cw-18,y+30,"right",hi?"#E7CF7A":"#6B7385");font(700,hi?36:30);txt(v,x+cw-18,y+74,"right",hi?"#fff":"#1B2A4A");font(400,13);txt(fit(u||"",cw-30),x+cw-18,y+98,"right",hi?"#C5CBE0":"#8892A3");x-=gap});y+=134}
    else if(b.type==="pairs"){const tw=W-2*MX,gap=18,per=2,cw=(tw-gap)/per,rh=36;need(60);secTitle(b.title);
      for(let i=0;i<b.cols.length;i+=per){const row=b.cols.slice(i,i+per);const hh=Math.max(...row.map(c=>(c.rows.length+2)*rh));need(hh+10);
        row.forEach((c,j)=>{const x=W-MX-(j+1)*cw-j*gap;rr(x,y,cw,hh,12,"#fff","#E1E5EC");ctx.fillStyle="#F4F6FA";ctx.fillRect(x+1,y+1,cw-2,rh-1);font(700,17);txt(c.title,x+cw-16,y+24,"right","#1B2A4A");font(400,14);txt(c.sub||"",x+16,y+24,"left","#6B7385");
          c.rows.forEach((r,k)=>{const yy=y+rh*(k+1);ctx.fillStyle="#EEF0F4";ctx.fillRect(x+1,yy,cw-2,1);font(400,16);txt(fit(r[0],cw*0.55),x+cw-16,yy+24,"right","#1C2433");font(700,17);txt(r[1],x+cw*0.30,yy+24,"left","#1C2433");font(400,13);txt(r[2]||"",x+16,yy+24,"left","#8892A3")});
          const ty=y+hh-rh;ctx.fillStyle="#FBF3DC";ctx.fillRect(x+1,ty,cw-2,rh-1);font(700,17);txt(c.total[0],x+cw-16,ty+24,"right","#1B2A4A");txt(c.total[1],x+cw*0.30,ty+24,"left","#1B2A4A");font(400,13);txt(c.total[2]||"",x+16,ty+24,"left","#8892A3")});y+=hh+gap}y+=6}
    else if(b.type==="settle"){const tw=W-2*MX,rh=48,rows=b.rows.length;const hh=Math.max(rows*rh,150);need(hh+60);secTitle(b.title);const fw=tw*0.42,lw=tw-fw-20;
      b.rows.forEach((r,i)=>{const yy=y+i*rh;ctx.fillStyle=i%2?"#F6F7FA":"#fff";ctx.fillRect(W-MX-lw,yy,lw,rh);ctx.fillStyle="#E4E7EE";ctx.fillRect(W-MX-lw,yy+rh-1,lw,1);font(400,18);txt(fit(r[0],lw-170),W-MX-14,yy+31,"right","#1C2433");font(700,19);txt(r[1],W-MX-lw+18,yy+31,"left","#1B2A4A")});
      rr(MX,y,fw,hh,16,"#1B2A4A");ctx.fillStyle="#C9A227";ctx.fillRect(MX+16,y+hh-6,fw-32,6);font(500,16);txt(b.final.l,MX+fw-22,y+40,"right","#E7CF7A");font(700,44);txt(b.final.v,MX+fw-22,y+96,"right","#fff");if(b.final.note){font(400,14);txt(b.final.note,MX+fw-22,y+128,"right","#C5CBE0")}y+=hh+20}
    else if(b.type==="kpis"){need(96);const n=b.items.length,cw=(W-2*MX)/n;b.items.forEach(([l,v],i)=>{const x=W-MX-(i+1)*cw;ctx.fillStyle="#E8EEF8";ctx.fillRect(x+4,y,cw-8,84);ctx.fillStyle="#C9A227";ctx.fillRect(x+4,y,cw-8,4);font(600,16);txt(l,x+cw/2,y+32,"center","#8C6D1F");font(700,26);txt(v,x+cw/2,y+68,"center","#1B2A4A")});y+=108}
    else if(b.type==="table"){
      const tw=W-2*MX,rh=38,cols=b.cols.map(([h,w])=>({h,w:w*tw}));
      const header=()=>{ctx.fillStyle="#1B2A4A";ctx.fillRect(MX,y,tw,rh);let x=W-MX;font(600,17);cols.forEach(c=>{txt(fit(c.h,c.w-12),x-c.w/2,y+25,"center","#fff");x-=c.w});y+=rh};
      need(rh*3+(b.title?44:0));if(b.title)secTitle(b.title);header();
      const draw=(r,isTot,zebra)=>{if(y+rh>H-70){newPage();header()}ctx.fillStyle=isTot?"#FBF3DC":zebra?"#F4F6FA":"#fff";ctx.fillRect(MX,y,tw,rh);ctx.strokeStyle="#D0D5DD";ctx.lineWidth=1;ctx.strokeRect(MX,y,tw,rh);
        let x=W-MX;font(isTot?700:400,17);r.forEach((v,i)=>{const c=cols[i];if(!c)return;const s=String(v??"");const isNum=/^[\d,.\-–]+( ?[سم³ج]+)?$/.test(s.trim());txt(fit(s,c.w-14),isNum?x-c.w/2:x-8,y+25,isNum?"center":"right",isTot?"#1B2A4A":"#172033");x-=c.w});y+=rh};
      let zi=0;const grow=g=>{if(y+rh>H-76){newPage();header()}ctx.fillStyle="#EEF1F7";ctx.fillRect(MX,y,tw,rh);ctx.strokeStyle="#D0D5DD";ctx.lineWidth=1;ctx.strokeRect(MX,y,tw,rh);font(700,17);txt(fit(g,tw-20),W-MX-10,y+25,"right","#1B2A4A");y+=rh;zi=0};
      b.rows.forEach(r=>{if(r&&r.g)return grow(r.g);if(r&&r.s)return draw(r.s,true,false);draw(r,false,zi++%2)});if(b.total)draw(b.total,true,false);(b.totals||[]).forEach(t=>draw(t,true,false));y+=24}
    else if(b.type==="text"){need(b.small?40:80);if(b.title){font(700,20);txt(b.title,W-MX,y+20,"right","#1B2A4A");y+=34}else y-=12;font(400,b.small?15:18);const words=String(b.text).split(/\s+/);let line="";for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>W-2*MX){need(30);txt(line,W-MX,y+18,"right",b.small?"#6B7385":"#172033");y+=30;line=w}else line=t}if(line){need(30);txt(line,W-MX,y+18,"right",b.small?"#6B7385":"#172033");y+=30}y+=14}
    else if(b.type==="sign"){need(100);y+=24;const n=b.items.length,cw=(W-2*MX)/n;b.items.forEach((l,i)=>{const x=W-MX-(i+1)*cw;font(600,18);txt(l,x+cw/2,y,"center","#1B2A4A");ctx.fillStyle="#9AA5BA";ctx.fillRect(x+40,y+50,cw-80,2)});y+=80}
  }
  const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true});
  pages.forEach((p,i)=>{if(i)pdf.addPage();pdf.addImage(p.toDataURL("image/jpeg",0.9),"JPEG",0,0,595.28,841.89)});
  await saveFile(filename,pdf.output("blob"));
}
async function saveFile(filename,blob){
  const type=/\.pdf$/i.test(filename)?"application/pdf":/\.json$/i.test(filename)?"application/json":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  let file;try{file=new File([blob],filename,{type})}catch(e){file=null}
  const tryShare=async()=>{await navigator.share({files:[file],title:filename})};
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
    try{await tryShare();return}catch(e){if(e&&e.name==="AbortError")return;
      if(e&&e.name==="NotAllowedError"){await modal({title:"الملف جاهز",body:`<p>${esc(filename)}</p><p class="small muted">اضغط (مشاركة) لإرساله على واتساب أو حفظه فى الملفات.</p>`,ok:"مشاركة / حفظ",onOk:async()=>{try{await tryShare()}catch(x){if(!(x&&x.name==="AbortError"))download()}}});return}}}
  download();
  function download(){const url=URL.createObjectURL(file||blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},5000);toast("تم تنزيل الملف")}
}

  if(!local){

    firebase.initializeApp(FB_CFG);S.auth=firebase.auth();S.db=firebase.firestore();
    try{await Promise.race([S.db.enablePersistence({synchronizeTabs:true}),new Promise(r=>setTimeout(r,2500))])}catch(e){}
    S.auth.onAuthStateChanged(u=>{if(S.bootstrapping)return;afterAuth(u)});
    return}
  S.local=true;S.isOwner=true;S.uid="local";localApply();resolveRole();

})();
