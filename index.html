function accrue(item,exKey,asOf,share){

    const full=s===ms&&e===me&&!(item.gaps||[]).some(g=>g.to>=s&&g.from<=e);
    const rate=rateAt(item.rates,e)||0,daily=rate/26,ot=exKey==="wex"?daily/7:(rateAt(item.ot,e)||0);

/* ============================================================ day permissions */

const CONTENT=d=>{const o={};ARR.forEach(k=>o[k]=(d[k]||[]).map(r=>{const c=Object.assign({},r);["_src","_i","_by","at"].forEach(z=>delete c[z]);return c}));o.notes=d.notes||"";return o};

/* ============================================================ DAY (manager) */
function openDay(date){if(S.dirty)saveDay();S.date=date;S.cur=normDay(clone(S.days[date]||{}),date)}
function dayTotals(date){const d=mergedDay(date,true);const m=M();let works=0,out=0,inn=0;
  d.hourly.forEach(h=>{const e=byId(m.hourly,h.e);if(e)works+=hourlyHours(h)*(rateAt(e.rates,date)||0)});
  d.trk.forEach(x=>{const t=byId(m.trucks,x.t);if(!t)return;works+=n0(x.n)*n0(t.cap)*truckRate(t,date)});
  d.itm.forEach(x=>{const it=byId(m.items,x.i);if(it)works+=n0(x.n)*itemRate(it,date)});
  d.geo.forEach(g=>{const s=byId(m.suppliers,g.c);if(s)works+=n0(g.q)*(num(g.r)??(rateAt(s.rates,date)||0))});
  const isFri=dow(date)===5;
  m.monthly.filter(e=>isActive(e,date)).forEach(e=>{const r=(rateAt(e.rates,date)||0)/26;const x=d.mex.find(z=>z.id===e.id);let v=isFri?0:r;if(x){if(x.k==="off"&&!isFri)v=0;else if(x.k==="half"&&!isFri)v=r/2;else if(x.k==="fri"&&isFri)v=r;v+=n0(x.ot)*(rateAt(e.ot,date)||0)}works+=v});
  m.workers.filter(w=>isActive(w,date)).forEach(w=>{const r=(rateAt(w.rates,date)||0)/26;const x=d.wex.find(z=>z.id===w.id);let v=isFri?0:r;if(x){if(x.k==="off"&&!isFri)v=0;else if(x.k==="half"&&!isFri)v=r/2;else if(x.k==="fri"&&isFri)v=r;v+=n0(x.ot)*r/7-n0(x.dh)*r/7}works+=v});
  d.exp.forEach(x=>{out+=n0(x.a);works+=n0(x.a)});d.dsl.forEach(x=>{const a=dieselAmount(x,date);out+=a;works+=a});d.pay.forEach(x=>out+=n0(x.a));d.adv.forEach(x=>out+=n0(x.a));d.inc.forEach(x=>inn+=n0(x.a));
  return{works,out,inn,d};
}
function updateDayTotals(){if(S.tab!=="day"||!S.cur)return;const t=dayTotals(S.cur.date);const el=$("#dayTot");if(el)el.innerHTML=`أعمال اليوم <b class="num">${money(t.works)}</b> · منصرف <b class="num">${money(t.out)}</b> · وارد <b class="num">${money(t.inn)}</b>`;
  const m=M(),d=t.d,date=S.cur.date;
  const st={hourly:d.hourly.reduce((s,h)=>{const e=byId(m.hourly,h.e);return s+(e?hourlyHours(h)*(rateAt(e.rates,date)||0):0)},0),
    trk:d.trk.reduce((s,x)=>{const tr=byId(m.trucks,x.t);if(!tr)return s;return s+n0(x.n)*n0(tr.cap)*truckRate(tr,date)},0),
    itm:d.itm.reduce((s,x)=>{const it=byId(m.items,x.i);return s+(it?n0(x.n)*itemRate(it,date):0)},0),
    dsl:d.dsl.reduce((s,x)=>s+dieselAmount(x,date),0),exp:d.exp.reduce((s,x)=>s+n0(x.a),0),pay:d.pay.reduce((s,x)=>s+n0(x.a),0),adv:d.adv.reduce((s,x)=>s+n0(x.a),0),inc:d.inc.reduce((s,x)=>s+n0(x.a),0)};
  Object.entries(st).forEach(([k,v])=>{const e=document.querySelector(`[data-tot="${k}"]`);if(e)e.textContent=v?money(v)+" ج":""});
}
function srcAttrs(r){return`data-src="${r._src}" data-i="${r._i}"`}
function byTag(r){return r._src&&r._src.startsWith("ent:")?`<span class="tag">أدخله: ${esc(nameSync(r._by))}</span>`:""}

async function saveMaster(m){try{await put("master/main",m);if(!S.local&&isOwner())await syncRoles(m);toast("تم الحفظ")}catch(e){toast("تعذر الحفظ: "+errMsg(e))}}
function assignList(k,m){const key=ASSIGN[k][0];return key==="_eq"?[...m.monthly,...m.hourly]:(m[key]||[])}
function permSummary(u,m){if(u.role==="accountant")return"يُدخل ويعدّل كل اليومية حتى الإقفال · يراجع كل الحسابات";
  return(u.perms||[]).map(p=>{const a=(u.assign||{})[p];if(!a||a==="*")return PERMS[p]+" (الكل)";const lab=ASSIGN[p][1];const list=assignList(p,m);return PERMS[p]+": "+a.map(id=>{const x=byId(list,id);return x?lab(x):""}).filter(Boolean).join("، ")}).join(" | ")||"—"}
function buildView(u,m){const P=u.perms||[],A=u.assign||{};
  const pick=(list,k,f)=>{const a=A[k];return(list||[]).filter(x=>!a||a==="*"||(Array.isArray(a)&&a.includes(x.id))).map(x=>{const o={};f.forEach(z=>{if(x[z]!==undefined&&x[z]!==null)o[z]=x[z]});return o})};
  const B=["id","name","type","from","to","gaps"];const v={suppliers:[],hourly:[],monthly:[],trucks:[],items:[],workers:[],partners:[],dieselPrices:[],dslEq:[]};
  if(P.includes("hourly"))v.hourly=pick(m.hourly,"hourly",B);if(P.includes("monthly"))v.monthly=pick(m.monthly,"monthly",B);
  if(P.includes("trucks"))v.trucks=pick(m.trucks,"trucks",["id","plate","cap","sup","from","to","gaps"]);if(P.includes("items"))v.items=pick(m.items,"items",["id","name","unit","from","to","gaps"]);
  if(P.includes("workers"))v.workers=pick(m.workers,"workers",["id","name","role","from","to","gaps"]);if(P.includes("diesel"))v.dslEq=pick([...m.monthly,...m.hourly],"diesel",B);
  const sids=new Set(v.trucks.map(t=>t.sup));v.suppliers=m.suppliers.filter(s=>sids.has(s.id)).map(s=>({id:s.id,name:s.name}));return v}

function ufInit(f){const sync=()=>{const r=f.querySelector("[data-role]").value;f.querySelectorAll("[data-for-role]").forEach(el=>{el.hidden=el.dataset.forRole!==r});

function readUserForm(v,u){u.name=(v.name||"").trim();u.role=v.role;
  if(u.role==="field"){u.perms=Object.keys(PERMS).filter(k=>v["p_"+k]);u.assign={};u.perms.forEach(k=>{if(v["all_"+k])u.assign[k]="*";else{const pre="a_"+k+"_";u.assign[k]=Object.keys(v).filter(x=>x.startsWith(pre)).map(x=>x.slice(pre.length))}});u.acc=[]}

async function createAuthUser(user,pin){const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(FB_CFG,"sec");const A=sec.auth();
  for(let g=1;g<=9;g++){try{const c=await A.createUserWithEmailAndPassword(mailOf(user,g),pinPw(pin));const id=c.user.uid;try{await A.signOut()}catch(e){}return{uid:id,email:mailOf(user,g)}}catch(x){if(x&&x.code==="auth/email-already-in-use")continue;throw x}}
  throw{message:"تعذر إنشاء الحساب – جرّب اسم دخول آخر"}}

async function backupRestore(file){const msg=$("#bakMsg");let data;try{data=JSON.parse(await file.text())}catch(e){msg.textContent="الملف غير صالح";return}
  if(!data||!data.master){msg.textContent="الملف لا يحتوى على بيانات التطبيق";return}
  const K=["days","entries","sealed","requests"];const counts=K.map(k=>Object.keys(data[k]||{}).length);
  const ok=await modal({title:"استعادة البيانات",body:`<p>سيتم حفظ: الإعدادات والبيانات الثابتة + ${counts[0]} يومية + ${counts[1]} إدخال مشرفين + ${counts[2]} نسخة معتمدة + ${counts[3]} طلب.</p><p class="small muted">المستخدمون الحاليون يبقون كما هم. الأيام بنفس التاريخ تُستبدل بنسخة الملف.</p>`,ok:"استعادة"});if(!ok)return;
  const cur=M();const nm=normMaster(clone(data.master));nm.users=cur.users||[];nm.legacyNames=Object.assign({},data.master.legacyNames||{},cur.legacyNames||{});
  (data.master.users||[]).forEach(u=>{if(u&&u.uid&&u.name&&!nm.users.some(x=>x.uid===u.uid))nm.legacyNames[u.uid]=u.name});

  const font=(w,s)=>ctx.font=`${w} ${s}px ${F}`;
  const txt=(t,x,yy,align="right",color="#172033")=>{ctx.fillStyle=color;ctx.textAlign=align;ctx.direction="rtl";ctx.fillText(String(t??""),x,yy)};
  const fit=(t,w)=>{t=String(t??"");if(ctx.measureText(t).width<=w)return t;while(t.length>1&&ctx.measureText(t+"…").width>w)t=t.slice(0,-1);return t+"…"};
  function newPage(){cv=document.createElement("canvas");cv.width=W;cv.height=H;cv.setAttribute("dir","rtl");ctx=cv.getContext("2d");pages.push(cv);
    ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.fillStyle="#1B2A4A";ctx.fillRect(0,0,W,8);ctx.fillStyle="#C9A227";ctx.fillRect(0,8,W,20);
    const lx=W-MX-84,ly=52;ctx.fillStyle="#C9A227";roundRect(lx,ly,84,84,14);ctx.fillStyle="#1B2A4A";roundRect(lx,ly,84,76,14);ctx.fillRect(lx,ly+50,84,26);
    font(700,50);txt("ك",lx+42,ly+56,"center","#fff");font(700,36);txt("كونتراكتر للمقاولات العامة",lx-22,ly+40,"right","#1B2A4A");
    ctx.direction="ltr";font(600,15);ctx.fillStyle="#8C6D1F";ctx.textAlign="right";ctx.fillText("C O N T R A C T O R   ·   G E N E R A L   C O N T R A C T I N G",lx-22,ly+72);
    font(400,18);txt("طريق الزعفرانة – سفاجا | قطاع كونتراكتر 4+920 إلى 6+100",MX,ly+50,"left","#5B6475");
    ctx.fillStyle="#1B2A4A";ctx.fillRect(0,158,W,4);
    font(400,15);txt(`صفحة ${pages.length}  –  صدر ${new Date().toLocaleString("ar-EG")}`,W/2,H-30,"center","#8892A3");
    y=200;if(pages.length===1){font(700,34);txt(title,W/2,y+10,"center","#1B2A4A");font(500,21);txt(subtitle,W/2,y+46,"center","#8C6D1F");y+=80}}
  function roundRect(x,yy,w,h,r){ctx.beginPath();ctx.moveTo(x+r,yy);ctx.arcTo(x+w,yy,x+w,yy+h,r);ctx.arcTo(x+w,yy+h,x,yy+h,r);ctx.arcTo(x,yy+h,x,yy,r);ctx.arcTo(x,yy,x+w,yy,r);ctx.closePath();ctx.fill()}
  const need=h=>{if(y+h>H-70)newPage()};
  newPage();
  for(const b of blocks){
    if(b.type==="kpis"){need(96);const n=b.items.length,cw=(W-2*MX)/n;b.items.forEach(([l,v],i)=>{const x=W-MX-(i+1)*cw;ctx.fillStyle="#E8EEF8";ctx.fillRect(x+4,y,cw-8,84);ctx.fillStyle="#C9A227";ctx.fillRect(x+4,y,cw-8,4);font(600,16);txt(l,x+cw/2,y+32,"center","#8C6D1F");font(700,26);txt(v,x+cw/2,y+68,"center","#1B2A4A")});y+=108}
    else if(b.type==="table"){

      const header=()=>{ctx.fillStyle="#1B2A4A";ctx.fillRect(MX,y,tw,rh);let x=W-MX;font(600,17);cols.forEach(c=>{txt(fit(c.h,c.w-12),x-c.w/2,y+25,"center","#fff");x-=c.w});y+=rh};
      need(rh*3+(b.title?40:0));if(b.title){font(700,22);txt(b.title,W-MX,y+22,"right","#1B2A4A");ctx.fillStyle="#C9A227";ctx.fillRect(MX,y+32,tw,3);y+=46}header();

        let x=W-MX;font(isTot?700:400,17);r.forEach((v,i)=>{const c=cols[i];if(!c)return;const s=String(v??"");const isNum=/^[\d,.\-–]+( ?[سم³ج]+)?$/.test(s.trim());txt(fit(s,c.w-14),isNum?x-c.w/2:x-8,y+25,isNum?"center":"right",isTot?"#1B2A4A":"#172033");x-=c.w});y+=rh};
      b.rows.forEach((r,i)=>draw(r,false,i%2));if(b.total)draw(b.total,true,false);(b.totals||[]).forEach(t=>draw(t,true,false));y+=24}
    else if(b.type==="text"){need(80);font(700,20);txt(b.title||"",W-MX,y+20,"right","#1B2A4A");y+=34;font(400,18);const words=String(b.text).split(/\s+/);let line="";for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>W-2*MX){need(30);txt(line,W-MX,y+18);y+=30;line=w}else line=t}if(line){need(30);txt(line,W-MX,y+18);y+=30}y+=14}
    else if(b.type==="sign"){need(110);y+=30;const n=b.items.length,cw=(W-2*MX)/n;b.items.forEach((l,i)=>{const x=W-MX-(i+1)*cw;font(600,18);txt(l,x+cw/2,y,"center","#1B2A4A");ctx.fillStyle="#9AA5BA";ctx.fillRect(x+40,y+50,cw-80,2)});y+=80}
  }
  const pdf=new window.jspdf.jsPDF({unit:"pt",format:"a4",compress:true});
  pages.forEach((p,i)=>{if(i)pdf.addPage();pdf.addImage(p.toDataURL("image/jpeg",0.9),"JPEG",0,0,595.28,841.89)});

}
async function saveFile(filename,blob){
  const type=/\.pdf$/i.test(filename)?"application/pdf":/\.json$/i.test(filename)?"application/json":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  let file;try{file=new File([blob],filename,{type})}catch(e){file=null}
  const tryShare=async()=>{await navigator.share({files:[file],title:filename})};
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
    try{await tryShare();return}catch(e){if(e&&e.name==="AbortError")return;
      if(e&&e.name==="NotAllowedError"){await modal({title:"الملف جاهز",body:`<p>${esc(filename)}</p><p class="small muted">اضغط (مشاركة) لإرساله على واتساب أو حفظه فى الملفات.</p>`,ok:"مشاركة / حفظ",onOk:async()=>{try{await tryShare()}catch(x){if(!(x&&x.name==="AbortError"))download()}}});return}}}
  download();
  function download(){const url=URL.createObjectURL(file||blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},5000);toast("تم تنزيل الملف")}
}
